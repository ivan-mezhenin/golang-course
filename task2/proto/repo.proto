syntax = "proto3";

package repo;

option go_package = "./proto";

message GetRepoRequest {
    string owner = 1;
    string repo = 2;
}

message GetRepoResponse {
  string name         = 1;
  string description  = 2;
  int32  stars        = 3;
  int32  forks        = 4;
  string created_at   = 5;
  string visibility   = 6;
}

service RepoService {
  rpc GetRepoInfo(GetRepoRequest) returns (GetRepoResponse) {}
}