services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: collector
    ports:
      - "50051:50051"
    networks:
      - app-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - COLLECTOR_ADDR=collector:50051
    depends_on:
      - collector
    networks:
      - app-network

networks:
  app-network:
    driver: bridge