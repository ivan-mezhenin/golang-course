name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
      # // TODO: other folders
        working-directory: task4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: task4/repo-stat/go.mod
          cache: true
          cache-dependency-path: task4/repo-stat/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '34.0'

      - name: Install golang tools
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.32.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          echo "Installed protoc-gen-go v1.32.0 and protoc-gen-go-grpc v1.3.0"

      - name: Install tools
        run: make -C repo-stat tools

      - name: Check protobuf generation
        run: |
          make proto
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Unit
        run: make unit

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    defaults:
      run:
        working-directory: task4
    steps:
      - uses: actions/checkout@v5

      - name: Integration tests
        run: make test
        env:
          CONTAINER_RUNTIME: docker
